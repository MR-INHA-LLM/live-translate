# 배포 — 전체 스택을 `docker compose --profile gpu up` 한 번으로 띄운다:
#   vllm-draft(:8000) + vllm-quality(:8000) + gateway + nginx (+ 정렬은 호스트 :8003).
# 호스트 vLLM에 붙이려면 DRAFT_URL/QUALITY_URL을 host.docker.internal:8001/8002로 override.
services:
  gateway:
    build: .
    restart: unless-stopped
    environment:
      DRAFT_URL: ${DRAFT_URL:-http://vllm-draft:8000/v1}
      QUALITY_URL: ${QUALITY_URL:-http://vllm-quality:8000/v1}
      ALIGN_URL: ${ALIGN_URL:-http://aligner:8000}                       # awesome-align 정렬 컨테이너
      DRAFT_MODEL: hy-mt1.5-1.8b
      QUALITY_MODEL: qwen3-4b-instruct
      QUALITY_ENABLED: ${QUALITY_ENABLED:-true}   # CPU 배포: false → 최종을 draft로 degrade
      API_KEYS: ${API_KEYS:-}                      # 공개 API 키(쉼표구분). 비면 인증 비활성
      DB_URL: sqlite+aiosqlite:////data/app.db
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:18090"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 빌드된 FE 정적 서빙 + API 프록시. `docker compose up` 한 번에 FE+API가 뜬다.
  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
      args:
        VITE_API_KEY: ${VITE_API_KEY:-}   # 콘솔 키(빌드 시 baked). API_KEYS 중 하나와 일치시킬 것
    restart: unless-stopped
    ports:
      - "18090:80"
    depends_on:
      gateway:
        condition: service_healthy

  # Draft tier (초벌, 저지연). 로컬 모델을 마운트해 재다운로드 없이 로드.
  vllm-draft:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: >
      --model /models/HY-MT1.5-1.8B --served-model-name hy-mt1.5-1.8b
      --enable-prefix-caching --max-model-len 4096 --gpu-memory-utilization 0.30 --port 8000
    environment: &vllm_env
      VLLM_WSL2_ENABLE_PIN_MEMORY: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "0"
      VLLM_ATTENTION_BACKEND: "FLASH_ATTN"
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    deploy: &vllm_gpu
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Quality tier (context-aware 최종, Qwen3-4B). draft와 단일 GPU 공유.
  vllm-quality:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: >
      --model /models/Qwen3-4B-Instruct-2507 --served-model-name qwen3-4b-instruct
      --enable-prefix-caching --max-model-len 8192 --gpu-memory-utilization 0.50 --port 8000
    environment: *vllm_env
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    deploy: *vllm_gpu

  # GPU 없는 환경용 CPU draft 서버 (transformers). quality는 끄고 draft만.
  #   QUALITY_ENABLED=false DRAFT_URL=http://draft-cpu:8000/v1 docker compose --profile cpu up
  draft-cpu:
    build:
      context: .
      dockerfile: cpu_server/Dockerfile
    profiles: ["cpu"]
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # 정렬 서비스 (awesome-align, CPU). GPU/CPU 배포 모두에서 사용. 호스트 HF 캐시를
  # 마운트해 모델(aneuraz/awesome-align-with-co)을 재다운로드 없이 로드.
  aligner:
    build:
      context: .
      dockerfile: aligner/Dockerfile
    profiles: ["gpu", "cpu"]
    restart: unless-stopped
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8000/health',timeout=3)).get('status')=='ok' else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  gateway-data:
  hf-cache:
